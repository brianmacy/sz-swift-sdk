# Security checks:
#   * CodeQL static analysis of the Swift sources (built against the installed
#     Senzing runtime on macOS) and of the workflow files.
#   * Dependency review of pull requests. The package has no SwiftPM
#     dependencies; this keeps it that way visibly.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 00:00 UTC.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-swift:
    name: CodeQL (Swift)
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Senzing runtime
        env:
          HOMEBREW_SENZING_ACCEPT_EULA: i_accept_the_senzing_eula
        run: |
          brew tap senzing/senzingsdk https://github.com/Senzing/homebrew-senzingsdk
          brew trust --tap senzing/senzingsdk || true
          brew install --cask senzingsdk
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: swift
          build-mode: manual
      - name: Build
        run: swift build --build-tests
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:swift

  codeql-actions:
    name: CodeQL (workflows)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: actions
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:actions

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
